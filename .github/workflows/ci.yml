name: CI
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  MIMIR_REPO: https://github.com/Mimir-IM/mimir
  MIMIR_REV: 883334b5990b4e07d6d3362f98777f23fb156664
  YGG_STREAM_REPO: https://github.com/Revertron/ygg_stream
  YGG_STREAM_REV: 94199be31bb099bde5a9cb4baed26544759bb5c7
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: mimir-desktop
      - name: Core sources (pinned)
        shell: bash
        run: |
          for p in "mimir $MIMIR_REPO $MIMIR_REV" "ygg_stream $YGG_STREAM_REPO $YGG_STREAM_REV"; do
            set -- $p
            git init -q upstream/$1 && git -C upstream/$1 fetch -q --depth 1 $2 $3 && git -C upstream/$1 checkout -q FETCH_HEAD
          done
      - name: System libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-3-dev libasound2-dev libxkbcommon-dev libxdo-dev libayatana-appindicator3-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mimir-desktop
      - name: Test
        working-directory: mimir-desktop
        run: cargo test --locked

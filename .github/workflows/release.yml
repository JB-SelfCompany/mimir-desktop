name: Release
# A v* tag builds every asset and publishes the GitHub Release; a manual run builds the same assets as run artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
  # Inno Setup 6 (signed by its author), installed portable into the runner's temp dir: no preinstalled version assumed.
  INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe
  INNO_SHA256: a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c
jobs:
  ffmpeg:
    # The Windows packages' minimal LGPL ffmpeg.exe (packaging/windows/ffmpeg.sh pins the source and the configure
    # line), cross-compiled with mingw-w64; rebuilt only when that script changes. A tag run can restore only its own
    # caches and the default branch's: a manual run on main after changing the script primes it for every tag.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: ffmpeg-win64
          key: ffmpeg-win64-${{ hashFiles('packaging/windows/ffmpeg.sh') }}
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64 libz-mingw-w64-dev nasm
          bash packaging/windows/ffmpeg.sh ffmpeg-win64
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-win64
          path: ffmpeg-win64/*
          if-no-files-found: error

  build:
    needs: ffmpeg
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: mimir-desktop
          submodules: true
      - name: Tag matches Cargo.toml
        if: github.ref_type == 'tag'
        shell: bash
        working-directory: mimir-desktop
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::tag $GITHUB_REF_NAME != v$version (Cargo.toml)"; exit 1; }
      - name: Free disk
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: System libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-3-dev libasound2-dev libxkbcommon-dev libxdo-dev libayatana-appindicator3-dev pkg-config
      - uses: actions/download-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: ffmpeg-win64
          path: mimir-desktop/ffmpeg-win64
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mimir-desktop
      - name: Build
        working-directory: mimir-desktop
        run: cargo build --release --locked
      - name: Package
        shell: bash
        working-directory: mimir-desktop
        run: |
          tag=${GITHUB_REF_NAME//\//-}  # a manual run on a branch: its name, / made -
          name=mimir-desktop-$tag-${{ runner.os == 'Windows' && 'windows-x86_64' || 'linux-x86_64' }}
          mkdir -p dist/$name out
          cp LICENSE README.md dist/$name/
          if [ "${{ runner.os }}" = Windows ]; then
            cp target/release/mimir-desktop.exe dist/$name/
            cp ffmpeg-win64/ffmpeg.exe ffmpeg-win64/FFMPEG-LICENSE.txt dist/$name/
            (cd dist && 7z a -tzip -mx=9 ../out/$name.zip $name >/dev/null)
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            inno=$(cygpath -u "$RUNNER_TEMP")/inno
            curl -fsSL -o inno.exe "$INNO_URL"
            echo "$INNO_SHA256  inno.exe" | sha256sum -c -
            MSYS_NO_PATHCONV=1 ./inno.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /PORTABLE=1 "/DIR=$(cygpath -w "$inno")"
            MSYS_NO_PATHCONV=1 "$inno/ISCC.exe" /Q "/DVersion=$version" "/DTag=$tag" "/DSourceDir=$(cygpath -w "$PWD/dist/$name")" "/O$(cygpath -w "$PWD/out")" packaging/windows/mimir.iss
          else
            cp target/release/mimir-desktop dist/$name/
            tar -C dist -cf - $name | gzip -9 > out/$name.tar.gz
            cargo install cargo-deb@3.8.0 --locked
            cargo deb --no-build --locked --output out/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}
          path: mimir-desktop/out/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: "{Linux,Windows}"
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: out
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: out/SHA256SUMS
      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*

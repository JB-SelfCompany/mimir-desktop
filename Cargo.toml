[package]
name = "mimir-desktop"
version = "0.1.0"
edition = "2024"
description = "Desktop client for the Mimir P2P messenger (Yggdrasil)"
license = "MPL-2.0"
repository = "https://github.com/JB-SelfCompany/mimir-desktop"

[dependencies]
eframe = "0.37"
mimir = { path = "../upstream/mimir" }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
base64 = "0.23"
urlencoding = "2"
qrcode = { version = "0.15", default-features = false }
sys-locale = "0.3"
# The client log file; the core already depends on it.
tracing-subscriber = "0.3"
# Warnings into that log (already built for the core).
tracing = "0.1"
time = { version = "0.3", features = ["local-offset"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
rfd = "0.15"
# Backup zips; deflate via flate2's pure-Rust zlib-rs only, no zopfli/bzip2/zstd/aes.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Output only: rodio 0.20's decoders cannot open MP4 (they hide the byte length symphonia's isomp4 reader needs), so
# media::player feeds it symphonia directly. Android voice is AAC-LC in MP4; the rest covers common audio files.
# Microphone capture for voice messages (rodio 0.20 already builds on cpal 0.15).
cpal = "0.15"
rodio = { version = "0.20", default-features = false }
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "mp3", "flac", "vorbis", "ogg", "wav", "pcm"] }
# Tray icon (Linux: AppIndicator over GTK, run on the tray's own thread).
tray-icon = "0.26"
# The main window's handle: its HWND (raising it from the tray thread), or that it is on Wayland.
raw-window-handle = "0.6"
# Desktop notifications (Windows toasts, freedesktop D-Bus on Linux).
notify-rust = "4"

[target.'cfg(windows)'.dependencies]
# The tray's message pump and raising the window from it (versions eframe and tray-icon already use).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }
tempfile = "3"

# ygg_stream is a cdylib; at opt-level 0 share-generics exports >65535 symbols and gnu ld fails ("export ordinal too large").
[profile.dev.package.ygg_stream]
opt-level = 2
